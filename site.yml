---
- name: Setup control node dependencies
  hosts: control
  become: yes
  tasks:
    - name: Install Python3 and required libraries
      apt:
        name:
          - python3
          - python3-cryptography
          - python3-openssl
        state: present

- name: Setup common packages
  hosts: all
  become: yes
  roles:
    - commmon

- name: Konfigurasi DNS server
  hosts: dns
  become: yes
  roles:
    - dns

- name: Konfigurasi Reverse Proxy with SSL
  hosts: dns
  become: yes
  roles:
    - reverse_proxy

- name: Konfigurasi Web Server
  hosts: web
  become: yes
  roles:
    - webserver

- name: Konfigurasi Database
  hosts: db
  become: yes
  roles:
    - db

- name: Final Nextcloud setup
  hosts: web
  become: yes
  tasks:
    - name: Menunggu Database Untuk Siap
      wait_for:
        host: 192.168.1.13
        port: 3306
        timeout: 30
        delay: 5
        state: started

    - name: Check Jika Nextcloud Sudah Terinstall
      stat:
        path: /var/www/nextcloud/config/config.php
      register: nextcloud_installed

    - name: Run Nextcloud installation
      command: >
        sudo -u www-data php /var/www/nextcloud/occ maintenance:install
        --database="mysql"
        --database-name="nextcloud"
        --database-user="admin"
        --database-pass="admin123"
        --database-host="192.168.1.13"
        --admin-user="admin"
        --admin-pass="admin123"
        --data-dir="/var/www/nextcloud/data"
      when: not nextcloud_installed.stat.exists
      changed_when: false
      register: install_result

    - name: Set trusted domains
      command: >
        sudo -u www-data php /var/www/nextcloud/occ config:system:set trusted_domains 1 --value="cloud.reihan.lan.local"
      when: install_result is succeeded or nextcloud_installed.stat.exists

    - name: Set overwrite protocol
      command: >
        sudo -u www-data php /var/www/nextcloud/occ config:system:set overwriteprotocol --value="https"
      when: install_result is succeeded or nextcloud_installed.stat.exists

    - name: Set trusted proxies
      command: >
        sudo -u www-data php /var/www/nextcloud/occ config:system:set trusted_proxies 0 --value="192.168.1.11"
      when: install_result is succeeded or nextcloud_installed.stat.exists

- name: Konfigurasi User Management dan Permissions
  hosts: web
  become: yes
  roles:
    - role: user_management
      vars:
        member_users:
          - { username: "user1", password: "password123" }
          - { username: "user2", password: "password123" }
          - { username: "user3", password: "password123" }

- name: Verifikasi Nextcloud installation
  hosts: web
  become: yes
  tasks:
    - name: Check Nextcloud status
      command: >
        sudo -u www-data php /var/www/nextcloud/occ status
      register: nextcloud_status
      changed_when: false

    - name: Display Nextcloud status
      debug:
        msg: "{{ nextcloud_status.stdout }}"
